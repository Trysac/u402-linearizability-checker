# gitleaks configuration: default rules plus local-only paths that are never committed.
title = "linearizability-checker gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Local tool output (ignored by git)"
paths = [
  '''(^|/)bin/''',
  '''(^|/)dist/''',
  '''\.(out|test|exe)$''',
]
